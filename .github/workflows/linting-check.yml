name: Sonar-Cloud-Backend

on:
  push:
    branches: [main] # oder main
  pull_request:
    branches: [main]

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          distribution: "temurin" # oder 'sulu'
          java-version: "25" # an Deine Java-Version anpassen

      - name: Wechsel in das Backend-Verzeichnis
        run: echo "Working Directory set"
        working-directory: backend

      - name: Build mit Maven
        run: mvn -B package # oder mvn verify
        working-directory: backend
        env:
          SPRING_DATA_MONGODB_URI: ${{ secrets.SPRING_DATA_MONGODB_URI }}

      - name: SonarCloud Analyse
        run: mvn sonar:sonar -B
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
